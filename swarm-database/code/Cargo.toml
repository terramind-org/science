[package]
name = "swarm-dbbench"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Benchmarks candidate metadata databases on swarm's hot-ref, ingest and point-read workloads."

# Standalone: not part of the main workspace, so its database drivers never enter the product's build.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
foundationdb = { version = "0.11.0", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
futures = "0.3.34"
hdrhistogram = "7.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-postgres = "0.7.18"
