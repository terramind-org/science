# Appended to postgresql.conf of a fresh `initdb -D <dir> -U bench --auth=trust -E UTF8` (Postgres 17.11).
port = 55432
listen_addresses = '127.0.0.1'
max_connections = 1100
shared_buffers = 2GB
synchronous_commit = on
fsync = on
wal_level = replica
max_wal_size = 8GB
wal_sync_method = fsync_writethrough   # forces a real flush (F_FULLFSYNC) on macOS
